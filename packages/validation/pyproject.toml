[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infalette-validation"
version = "0.1.0"
description = "Shared validation schemas for infalette"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "email-validator>=2.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/infalette_validation"]
