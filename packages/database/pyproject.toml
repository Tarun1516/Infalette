[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infalette-database"
version = "0.1.0"
description = "Database models and migrations for infalette"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "infalette-config>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/infalette_database"]
