# Alembic configuration for the Infalette database package.
#
# DSN precedence (resolved at runtime by alembic/env.py:get_url):
#   1. DATABASE_URL_DIRECT  (Neon direct endpoint, used in production)
#   2. DATABASE_URL         (fallback for local dev / legacy)
#
# This file's `sqlalchemy.url` is a placeholder; env.py overrides it from
# settings on every invocation. Set DATABASE_URL_DIRECT in your environment
# (e.g. via .env) before running `alembic upgrade head`.

[alembic]
script_location = alembic
prepend_sys_path = src
# Placeholder fallback — env.py:get_url() overrides from settings on every run.
sqlalchemy.url = postgresql+asyncpg://infalette:infalette@localhost:5432/infalette

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
