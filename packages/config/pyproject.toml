[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infalette-config"
version = "0.1.0"
description = "Configuration management for infalette"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.5.0",
    "pydantic>=2.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/infalette_config"]
